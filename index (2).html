<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05060F">
  <meta name="description" content="Kifayat Sayed — AI and Machine Learning portfolio.">
  <title>Kifayat Sayed | AI &amp; ML</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    :root {
      color-scheme: dark;
      --navy: #05060F;
      --ice: #D8ECF8;
      --white: #F7F9FC;
      --slate: #566273;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--navy); }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: var(--navy);
      color: var(--white);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(720px, 100%); text-align: center; }
    .mark {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      margin: 0 auto 28px;
      border: 1px solid rgba(216, 236, 248, .38);
      border-radius: 16px;
      color: var(--ice);
      font-family: "Space Grotesk", Inter, sans-serif;
      font-size: 26px;
      font-weight: 700;
    }
    .eyebrow {
      margin: 0 0 14px;
      color: var(--ice);
      font-size: 12px;
      font-weight: 650;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-family: "Space Grotesk", Inter, sans-serif;
      font-size: clamp(42px, 8vw, 76px);
      line-height: 1.04;
      letter-spacing: -.055em;
    }
    .claim {
      max-width: 560px;
      margin: 24px auto 0;
      color: #c2ccd8;
      font-size: clamp(16px, 2.6vw, 20px);
      line-height: 1.7;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 36px;
      padding: 10px 14px;
      border: 1px solid rgba(216, 236, 248, .18);
      border-radius: 999px;
      color: #c2ccd8;
      font-size: 12px;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ice); }
    footer { margin-top: 68px; color: var(--slate); font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-label="K monogram">K</div>
    <p class="eyebrow">AI · Machine Learning · Data Science</p>
    <h1>Kifayat Sayed</h1>
    <p class="claim">I turn messy datasets into clear, explainable machine-learning solutions.</p>
    <div class="status"><span class="dot" aria-hidden="true"></span>Portfolio in progress</div>
    <footer>More projects and case studies coming soon.</footer>
  </main>
</body>
</html>
